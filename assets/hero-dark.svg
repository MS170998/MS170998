<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Mayank Singh — Software Engineer</title>
  <desc id="heroDesc">Mayank Singh builds fast, thoughtful web products, from the first pixel to production. Currently building Hello Drawing.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10141B"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 170) rotate(90) scale(300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B8BFF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#8B8BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="translate(700 340) rotate(-90) scale(240 200)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9E7D" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FF9E7D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#FFFFFF" fill-opacity=".14"/>
    </pattern>
    <filter id="boardShadow" x="620" y="-10" width="560" height="390" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto">
      <path d="M1 1 L6.8 4 L1 7" stroke="#9B9BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="boardClip">
      <path d="M664 88 H1136 V300 C1136 313.255 1125.255 324 1112 324 H688 C674.745 324 664 313.255 664 300 Z"/>
    </clipPath>

    <style>
      .draw {
        stroke-dasharray: 420;
        stroke-dashoffset: 0;
        animation: draw 1.1s cubic-bezier(.4, 0, .2, 1) forwards;
      }
      .d1 { animation-delay: .20s; }
      .d2 { animation-delay: .40s; }
      .d3 { animation-delay: .55s; }
      .d4 { animation-delay: .70s; }
      .d5 { animation-delay: .85s; }
      .fade {
        opacity: 1;
        animation: fade .55s ease 1.15s forwards;
      }
      .float { animation: float 5.5s ease-in-out infinite; }
      .pulse {
        animation: pulse 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-4px, 4px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .45; transform: scale(.8); }
      }
      @media (prefers-reduced-motion: reduce) {
        .draw { animation: none; stroke-dashoffset: 0; }
        .fade { animation: none; opacity: 1; }
        .float, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".10"/>

  <g>
    <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#warm)"/>
    <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#glow)"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#98A1B2" font-size="12.5" font-weight="650" letter-spacing="2.4">SOFTWARE ENGINEER · BENGALURU, INDIA</text>

    <text x="62" y="178" fill="#F5F6F8" font-size="76" font-weight="700" letter-spacing="-2.8">Mayank Singh<tspan fill="#FF9E7D">.</tspan></text>

    <text x="64" y="226" fill="#A6AEBD" font-size="23" letter-spacing="-.3">I build <tspan fill="#EEF1F6" font-weight="600">fast, thoughtful</tspan> web products</text>
    <text x="64" y="258" fill="#A6AEBD" font-size="23" letter-spacing="-.3">— from the first pixel to production.</text>
  </g>

  <g>
    <rect x="64" y="286" width="296" height="40" rx="20" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".10"/>
    <circle cx="88" cy="306" r="9" fill="#4ADE80" fill-opacity=".12"/>
    <circle class="pulse" cx="88" cy="306" r="4" fill="#4ADE80"/>
    <text x="103" y="311" fill="#C6CDD9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">Currently building Hello Drawing</text>
  </g>

  <g filter="url(#boardShadow)">
    <rect x="664" y="36" width="472" height="288" rx="24" fill="#161B24" fill-opacity=".95" stroke="#FFFFFF" stroke-opacity=".10"/>
  </g>

  <g clip-path="url(#boardClip)">
    <rect x="664" y="88" width="472" height="236" fill="url(#dots)"/>
  </g>

  <g>
    <rect x="688" y="55" width="21" height="21" rx="6.5" fill="#9B9BFF"/>
    <path d="M693.5 66.5C695.5 62.5 697.5 70 700 66.5C701.8 64.1 702.6 64.6 704 65.2" stroke="#0B0D12" stroke-width="1.7" stroke-linecap="round"/>
    <text x="719" y="71" fill="#EEF1F6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="-.1">hello drawing</text>
    <circle cx="1072" cy="65" r="3.2" fill="#4ADE80"/>
    <text x="1082" y="69" fill="#8B93A3" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">saved</text>
    <line x1="664" y1="88" x2="1136" y2="88" stroke="#FFFFFF" stroke-opacity=".09"/>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <rect class="draw d1" x="714" y="132" width="104" height="68" rx="10" stroke="#FF9E7D" stroke-width="2.5" fill="#FF9E7D" fill-opacity=".09"/>

    <path class="draw d2" d="M833 163 C862 156 876 150 897 148" stroke="#9B9BFF" stroke-width="2.2" marker-end="url(#arrowHead)"/>

    <ellipse class="draw d3" cx="954" cy="145" rx="43" ry="31" stroke="#5EDCC9" stroke-width="2.5" fill="#5EDCC9" fill-opacity=".09"/>

    <path class="draw d4" d="M930 214 L962 246 L930 278 L898 246 Z" stroke="#E8C06A" stroke-width="2.5" fill="#E8C06A" fill-opacity=".09"/>

    <path class="draw d5" d="M718 258 C744 234 764 276 792 256 C810 243 824 246 842 258" stroke="#9B9BFF" stroke-width="2.5"/>
  </g>

  <g class="fade">
    <rect x="902" y="105" width="104" height="80" rx="8" stroke="#9B9BFF" stroke-width="1.4" stroke-dasharray="5 4"/>
    <g fill="#0B0D12" stroke="#9B9BFF" stroke-width="1.4">
      <rect x="898.5" y="101.5" width="7" height="7" rx="1.5"/>
      <rect x="1002.5" y="101.5" width="7" height="7" rx="1.5"/>
      <rect x="898.5" y="181.5" width="7" height="7" rx="1.5"/>
      <rect x="1002.5" y="181.5" width="7" height="7" rx="1.5"/>
    </g>
  </g>

  <g class="float">
    <path d="M1006 226 L1006 248 L1011.2 243.5 L1014.4 251 L1018.1 249.4 L1014.9 242 L1021.5 242 Z" fill="#9B9BFF" stroke="#0B0D12" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="1019" y="213" width="72" height="24" rx="12" fill="#9B9BFF"/>
    <text x="1030" y="229" fill="#0B0D12" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Mayank</text>
  </g>
</svg>
